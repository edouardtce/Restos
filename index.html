<style>
:root{
  --bg:#FBF7F8;--surface:#FFFFFF;--ink:#24151C;--muted:#6E5C64;--line:#EADFE3;--wine:#7B2D3B;--wine-ink:#FFFFFF;--chip:#F3EAED;
  --mich:#B22222;--gm:#8A5E00;--oth:#2E7D32;

  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#160F13;--surface:#21171D;--ink:#F3E9ED;--muted:#B5A2AB;--line:#3A2B33;--wine:#D88A9A;--wine-ink:#1E1217;--chip:#2C2027;
  --mich:#F07A6E;--gm:#E2B65A;--oth:#7CC983;
  --c0:#D88A9A;--c1:#E0976A;--c2:#7FB6DE;--c3:#EE8A7E;--c4:#7CCBA8;--c5:#E7B45A;--c6:#B59BE3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160F13;--surface:#21171D;--ink:#F3E9ED;--muted:#B5A2AB;--line:#3A2B33;--wine:#D88A9A;--wine-ink:#1E1217;--chip:#2C2027;
  --mich:#F07A6E;--gm:#E2B65A;--oth:#7CC983;
  --c0:#D88A9A;--c1:#E0976A;--c2:#7FB6DE;--c3:#EE8A7E;--c4:#7CCBA8;--c5:#E7B45A;--c6:#B59BE3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
h1{font:400 clamp(2.4rem,9vw,3.6rem)/1.02 Gloock,Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:52ch}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.draw{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--wine);color:var(--wine-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.pick{display:none;position:relative;border-radius:20px;padding:22px 22px 20px;margin:0 0 26px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pick.on{display:block}
.pick::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--cc)}
.pick .kicker{color:var(--muted);font-size:.9rem;margin:0 0 4px}
.pick h2{font:400 clamp(1.9rem,7vw,2.6rem)/1.05 Gloock,Georgia,serif;margin:0 0 6px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.92rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink));color:var(--bg)}
.chip .n{opacity:.7;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.92rem}
.count{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.group{margin:26px 0 8px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--cc);padding-bottom:4px}
.group h3{font:400 1.45rem/1.1 Gloock,Georgia,serif;margin:0;color:var(--cc)}
.group small{color:var(--muted)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px 20px;margin:10px 0}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--cc)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font:400 1.3rem/1.15 Gloock,Georgia,serif;margin:0}
.meta{color:var(--muted);font-size:.9rem;margin:3px 0 8px}
.meta b{color:var(--ink);font-weight:600}
.fav{border:0;background:transparent;padding:4px;cursor:pointer;color:var(--muted);flex:0 0 auto}
.fav svg{width:24px;height:24px;display:block}
.fav[aria-pressed="true"]{color:var(--wine)}
.fav[aria-pressed="true"] path{fill:currentColor}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tag{font-size:.8rem;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid currentColor}
.tag.m,.tag.g,.tag.o{color:var(--muted)}
.tag.h{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.desc{margin:0 0 6px}
.price{font-weight:600;margin:0 0 10px}
.go{display:inline-block;color:var(--wine);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.empty{padding:28px 0;color:var(--muted)}
.theme{position:absolute;right:18px;top:24px}
@media (prefers-reduced-motion:no-preference){.pick.on{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
.city{display:flex;background:var(--chip);border-radius:16px;padding:4px;margin:0 0 18px;gap:4px}
.city button{flex:1;border:0;background:transparent;border-radius:12px;padding:11px 8px;font-weight:600;cursor:pointer;color:var(--muted)}
.city button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>

: [], "u": "https://www.google.com/maps/search/?api=1&query=Halle+Saint-Pierre+Clermont-Ferrand", "z": "63000"}, {"c": 6, "s": "Végétal", "n": "Ô Miracle", "v": "", "a": "Clermont-Ferrand", "r": "5,0", "k": "149", "t": "Bistrot végétarien, plats expliqués", "p": "", "b": 2, "d": [], "u": "https://www.google.com/maps/search/?api=1&query=O+Miracle+Clermont-Ferrand&query_place_id=ChIJeVfmenbAdQsR71Ljgm-ppww", "z": "63000"}, {"c": 6, "s": "Végétal", "n": "Planty Kitchen", "v": "", "a": "Clermont-Ferrand", "r": "4,9", "k": "135", "t": "100 % vegan, carte qui change chaque semaine", "p": "", "b": 1, "d": [], "u": "https://www.google.com/maps/search/?api=1&query=Planty+Kitchen+Clermont-Ferrand&query_place_id=ChIJYbZR_NEb90cRL6-ebrHBSK8", "z": "63000"}, {"c": 6, "s": "Végétal", "n": "Ne Rien Faire", "v": "", "a": "Clermont-Ferrand", "r": "4,8", "k": "126", "t": "Végétarien fait maison", "p": "", "b": 2, "d": [], "u": "https://www.google.com/maps/search/?api=1&query=Ne+Rien+Faire+Clermont-Ferrand&query_place_id=ChIJAQDsS-Yb90cRlpya4OEQ7LA", "z": "63000"}]}};
let city='lyon';try{city=localStorage.getItem('city')||'lyon'}catch(e){}
if(!ALL[city])city='lyon';
let C,I,favs=new Set();
const st={q:'',c:-1,s:'',b:0,f:false,a:''};
const $=s=>document.querySelector(s);
const col=i=>`var(--c${i})`;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const heartSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.7 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.3 0 5.6 3.1 4.3 6.6-1.8 4.8-9.3 9.4-9.3 9.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function favKey(){return 'favs-'+city}
function loadFavs(){favs=new Set();try{let v=localStorage.getItem(favKey());if(v===null&&city==='lyon')v=localStorage.getItem('favs');favs=new Set(JSON.parse(v||'[]'))}catch(e){}}
function saveFavs(){try{localStorage.setItem(favKey(),JSON.stringify([...favs]))}catch(e){}}
function priceText(x){if(x.p)return x.p;return x.b?'€'.repeat(x.b):''}
function meta(x){const p=[];if(x.r)p.push(`<b>${x.r}</b> sur Google (${x.k.trim()} avis)`);p.push(esc(x.a)+(x.v.includes(',')?' ('+esc(x.v.split(', ').slice(1).join(', '))+')':''));return p.join(', ')}
function tags(x){let t='';x.d.forEach(([d,k])=>t+=`<span class="tag ${k}">${esc(d)}</span>`);return t?`<div class="tags">${t}</div>`:''}
function card(x){const pr=priceText(x);const on=favs.has(x.n);
  return `<article class="card" style="--cc:${col(x.c)}"><div class="top"><h4 class="name">${esc(x.n)}</h4>
  <button class="fav" data-id="${x.id}" aria-pressed="${on}" aria-label="${on?'Retirer des':'Ajouter aux'} favoris : ${esc(x.n)}">${heartSvg}</button></div>
  <p class="meta">${meta(x)}</p>${tags(x)}${x.t?`<p class="desc">${esc(x.t)}</p>`:''}<p class="price">${esc(pr||'Prix non communiqué')}</p>
  <a class="go" href="${x.u}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></article>`}
function match(x){
  if(st.c>=0&&x.c!==st.c)return false;if(st.s&&x.s!==st.s)return false;if(st.b&&x.b!==st.b)return false;
  if(st.f&&!favs.has(x.n))return false;if(st.a&&x.a!==st.a)return false;
  if(st.q){const q=norm(st.q);if(!norm([x.n,x.t,x.a,x.s,C[x.c],x.d.map(d=>d[0]).join(' ')].join(' ')).includes(q))return false}
  return true}
function render(){const r=I.filter(match);const nu=new Set(r.map(x=>x.u)).size;
  $('#count').textContent=nu?`${nu} adresse${nu>1?'s':''}`:'';
  if(!r.length){$('#list').innerHTML='<p class="empty">Aucune adresse ne correspond. Retire un filtre ou touche « Tout afficher ».</p>';return}
  let h='',key='';r.forEach(x=>{const k=x.c+'|'+x.s;if(k!==key){key=k;const n=r.filter(y=>y.c===x.c&&y.s===x.s).length;
    h+=`<div class="group" style="--cc:${col(x.c)}"><h3>${esc(x.s||C[x.c])}</h3><small>${x.s?esc(C[x.c])+', ':''}${n}</small></div>`}h+=card(x)});
  $('#list').innerHTML=h}
function chips(){
  $('#cats').innerHTML=`<button class="chip" data-c="-1" aria-pressed="${st.c<0}">Tout</button>`+C.map((c,i)=>`<button class="chip" style="--cc:${col(i)}" data-c="${i}" aria-pressed="${st.c===i}">${esc(c)}<span class="n">${new Set(I.filter(x=>x.c===i).map(x=>x.u)).size}</span></button>`).join('');
  const subs=st.c<0?[]:[...new Set(I.filter(x=>x.c===st.c&&x.s).map(x=>x.s))];
  $('#subs').style.display=subs.length?'flex':'none';
  $('#subs').innerHTML=subs.length?`<button class="chip" data-s="" aria-pressed="${!st.s}" style="--cc:${col(st.c)}">Toutes</button>`+subs.map(s=>`<button class="chip" style="--cc:${col(st.c)}" data-s="${esc(s)}" aria-pressed="${st.s===s}">${esc(s)}</button>`).join(''):'';
  $('#budget').innerHTML=[['Tous',0],['€',1],['€€',2],['€€€',3]].map(([l,v])=>`<button data-b="${v}" aria-pressed="${st.b===v}">${l}</button>`).join('');
  $('#favBtn').setAttribute('aria-pressed',st.f)}
function resetFilters(){Object.assign(st,{q:'',c:-1,s:'',b:0,f:false,a:''});$('#q').value='';$('#pick').className='pick';$('#drawBtn').textContent='Tirer une adresse au sort'}
function setCity(c){city=c;try{localStorage.setItem('city',c)}catch(e){}
  const D=ALL[c];C=D.cats;I=D.items;I.forEach((x,i)=>x.id=i);loadFavs();resetFilters();
  document.querySelectorAll('#city button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.city===c));
  $('#lede').textContent=`${new Set(I.map(x=>x.u)).size} adresses à ${D.zone}, choisies pour un dîner à deux. Filtre par envie, budget ou quartier, ou laisse le hasard décider.`;
  const areas=[...new Set(I.map(x=>x.a))].sort((a,b)=>{const la=a.startsWith(D.main),lb=b.startsWith(D.main);if(la!==lb)return la?-1:1;return a.localeCompare(b,'fr',{numeric:true})});
  $('#area').innerHTML='<option value="">Tous les quartiers</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');$('#area').value='';
  chips();render()}
$('#city').onclick=e=>{const b=e.target.closest('[data-city]');if(b&&b.dataset.city!==city){setCity(b.dataset.city);window.scrollTo(0,0)}};
$('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;st.c=+b.dataset.c;st.s='';chips();render()};
$('#subs').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;st.s=b.dataset.s;chips();render()};
$('#budget').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;st.b=+b.dataset.b;chips();render()};
$('#favBtn').onclick=()=>{st.f=!st.f;chips();render()};
$('#area').onchange=e=>{st.a=e.target.value;render()};
$('#q').oninput=e=>{st.q=e.target.value.trim();render()};
document.addEventListener('click',e=>{const b=e.target.closest('.fav');if(!b)return;const x=I[+b.dataset.id];
  favs.has(x.n)?favs.delete(x.n):favs.add(x.n);saveFavs();
  document.querySelectorAll('.fav').forEach(f=>{const y=I[+f.dataset.id];if(y&&y.n===x.n){f.setAttribute('aria-pressed',favs.has(x.n));f.setAttribute('aria-label',(favs.has(x.n)?'Retirer des':'Ajouter aux')+' favoris : '+x.n)}});
  if(st.f)render()});
$('#resetBtn').onclick=()=>{resetFilters();$('#area').value='';chips();render()};
$('#drawBtn').onclick=()=>{const r=I.filter(match);const pool=r.length?r:I;const x=pool[Math.floor(Math.random()*pool.length)];
  const p=$('#pick');p.style.setProperty('--cc',col(x.c));
  p.innerHTML=`<p class="kicker">Ce soir, pourquoi pas…</p><h2>${esc(x.n)}</h2><p class="meta">${esc(x.s||C[x.c])}, ${meta(x)}</p>${tags(x)}${x.t?`<p class="desc">${esc(x.t)}</p>`:''}<p class="price">${esc(priceText(x)||'Prix non communiqué')}</p><a class="go" href="${x.u}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a>`;
  p.className='pick';void p.offsetWidth;p.className='pick on';$('#drawBtn').textContent='Tirer une autre adresse'};
setCity(city);
</script>
